# E8 Markets - E8 One $5,000 Challenge Account Configuration
# Sourced from official Help Center (Trailing Drawdown / Daily Pause Rules)

account_name: "e8_one_5k_challenge"

symbols:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD

account:
  plan: "E8 One Challenge"
  initial_balance: 5000

compliance:
  # E8 One 規則 (依據使用者 Dashboard 客製化數據):
  daily_drawdown_limit: 0.04    # 4% Daily Drawdown (每日最大浮動或已實現虧損)
  max_drawdown_limit: 0.06      # 6% Dynamic Drawdown (動態回撤，最高鎖定在初始資金)
  profit_target: 0.09            # 9% 利潤目標 ($450)
  best_day_ratio: 0.40           # 40% Best Day Rule (單日獲利不可超過總獲利的40%)
  best_day_limit: 180            # $450 × 40% = $180/天 (安全閥)
  daily_api_request_limit: 4000  # 每日 API 請求上限
  drawdown_type: "dynamic"       # 動態回撤 (Trailing High-Water Mark)

  # 安全裕度 (提前停止交易，避免觸碰紅線)
  daily_drawdown_stop: 0.85      # 達到日損 85% 時停止
  max_drawdown_stop: 0.85        # 達到總損 85% 時停止
  best_day_stop: 0.85            # 達到最佳日限額 85% 時停止
  hwm_state_path: data/hwm_state_e8_one_5k.json

execution:
  max_positions: 3
  default_risk_pct: 0.005        # 每筆交易風險 0.5% ($25)
  max_slippage_pips: 2.0
  random_delay_min: 0.5
  random_delay_max: 2.0

decision_store:
  db_path: data/decisions_e8_one_5k.db

monitor:
  trade_journal_path: data/trade_journal_e8_one_5k.jsonl
  memory_dir: MEMORY_E8_ONE_5K

optimization:
  state_path: data/optimization_state_e8_one_5k.json

scheduler:
  market_hours:
    enabled: true
    close_day: "Friday"
    close_time_utc: "22:00"    # 冬令時 UTC (夏令時自動調整為 21:00)
    open_day: "Sunday"
    open_time_utc: "22:00"     # 冬令時 UTC (夏令時自動調整為 21:00)
    force_close_before_weekend: false
    force_close_minutes_before: 15
    # DST 自動調整 (E8 Markets 伺服器 = Europe/Athens)
    dst_auto: true
    server_timezone: "Europe/Athens"
  # v1.2.0: 時段感知掃描節奏
  session_aware_enabled: true
  active_session_interval_seconds: 3600   # 1h during London/NY
  quiet_session_interval_seconds: 14400   # 4h during off-hours
  # DST 自動調整交易時段 (London/NY 各自根據當地 DST 調整)
  session_dst_auto: true
  london_timezone: "Europe/London"
  ny_timezone: "America/New_York"
  # v1.2.0: 波動率觸發掃描
  volatility_trigger_enabled: true
  volatility_threshold_pct: 0.3
  volatility_window_minutes: 30
  volatility_cooldown_seconds: 900
  # v1.2.0: 多時間框架分析 (先停用，驗證日內數據後再啟用)
  multi_timeframe_enabled: false
  entry_timeframe: "4h"
  intraday_lookback_days: 90
instruments:
  EURUSD:
    pip_size: 0.0001
    pip_value: 10.0
    min_lot: 0.01
    max_lot: 5.0
  GBPUSD:
    pip_size: 0.0001
    pip_value: 10.0
    min_lot: 0.01
    max_lot: 5.0
  USDJPY:
    pip_size: 0.01
    pip_value: 10.0
    min_lot: 0.01
    max_lot: 5.0
  AUDUSD:
    pip_size: 0.0001
    pip_value: 10.0
    min_lot: 0.01
    max_lot: 5.0
