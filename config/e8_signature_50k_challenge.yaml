# 尚未自動 enforcement 的 Signature 規則：
# - Overnight holding: no。現有 scheduler 只有週末強平，沒有每日收市前強平。
# - 35% consistency / 5 profitable days。屬 payout / funded-stage 邏輯，非目前 challenge runtime 風控。
# - E8 broker 的 orders / modifies / daily position quotas。現時沒有獨立 broker-level quota accounting。
